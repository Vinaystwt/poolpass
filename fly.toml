app = "poolpass-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  ACCREDITATION_STORE = "/app/services/data/accreditation.json"
  INDEXER_STORE = "/app/services/data/events.json"

[[mounts]]
  source = "poolpass_data"
  destination = "/app/services/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
